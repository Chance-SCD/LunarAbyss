; UE 5.8.3 - spec v1.8.1 section 6.1 / 11.3
; NOTE: r.MegaLights.Allow is NOT a 5.8 cvar (logs "deferred - dummy variable created"). Use:
;   r.MegaLights.Allowed        - gate per scalability level / device profile (this file)
;   r.MegaLights.EnableForProject - project default (Project Settings > Rendering > Direct Lighting > MegaLights)

; ---- Config/DefaultEngine.ini ----
[/Script/Engine.RendererSettings]
r.MegaLights.EnableForProject=0

; ---- Config/DefaultDeviceProfiles.ini ----
[Windows_Baseline DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=r.MegaLights.Allowed=0
+CVars=r.RayTracing.Enable=0
+CVars=r.Lumen.HardwareRayTracing=0
+CVars=r.DynamicGlobalIlluminationMethod=1
+CVars=r.ReflectionMethod=1
+CVars=r.Lumen.Reflections.Allow=1
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.Shadow.Virtual.MaxPhysicalPages=2048
+CVars=r.LightFunctionAtlas=0
+CVars=r.Tonemapper.Sharpen=0.5
; exposure: manual-ish range so dark interiors stay dark (EV100 1..8)
+CVars=r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=1

[Windows_High DeviceProfile]
DeviceType=Windows
BaseProfileName=Windows
+CVars=r.MegaLights.Allowed=1
+CVars=r.RayTracing.Enable=1
+CVars=r.Lumen.HardwareRayTracing=1
+CVars=r.LightFunctionAtlas=1
